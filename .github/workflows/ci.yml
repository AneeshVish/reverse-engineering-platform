name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  engineering:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-groups --frozen

      - name: Codegen
        run: uv run reveng-codegen --verify-dirty --json

      - name: Ruff lint
        run: uv run ruff check libs tools tests/engineering

      - name: Ruff format check
        run: uv run ruff format --check libs tools tests/engineering

      - name: Pyright
        run: uv run pyright

      - name: Repository validation
        run: uv run reveng-validate --json

      - name: Engineering tests
        run: uv run pytest tests/engineering

      - name: Workspace build dry-run
        run: uv run reveng-workspace-build --dry-run --json
