[project]
name = "reveng-desktop-sdk"
version = "0.1.0"
description = "RevENG desktop integration / IPC client library (Engineering Phase 015)"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "reveng-core-substrate",
    "reveng-public-api",
    "reveng-types",
    "reveng-errors",
    "reveng-logging",
    "reveng-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
reveng-core-substrate = { workspace = true }
reveng-public-api = { workspace = true }
reveng-types = { workspace = true }
reveng-errors = { workspace = true }
reveng-logging = { workspace = true }
reveng-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reveng_desktop_sdk"]
