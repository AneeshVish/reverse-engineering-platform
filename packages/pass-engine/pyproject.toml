[project]
name = "reveng-pass-engine"
version = "0.1.0"
description = "RevENG pass engine — deterministic pass execution framework (Impl Spec 003)"
requires-python = ">=3.12"
dependencies = [
    "reveng-core-substrate",
    "reveng-domain-producers",
    "reveng-types",
    "reveng-errors",
    "reveng-logging",
    "reveng-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
reveng-core-substrate = { workspace = true }
reveng-domain-producers = { workspace = true }
reveng-types = { workspace = true }
reveng-errors = { workspace = true }
reveng-logging = { workspace = true }
reveng-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reveng_pass_engine"]
