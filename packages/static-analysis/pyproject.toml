[project]
name = "reveng-static-analysis"
version = "0.1.0"
description = "RevENG static analysis framework — produces canonical IR and evidence (Impl Spec 006)"
requires-python = ">=3.12"
dependencies = [
    "reveng-core-substrate",
    "reveng-domain-producers",
    "reveng-pass-engine",
    "reveng-intermediate-representation",
    "reveng-storage-evidence",
    "reveng-types",
    "reveng-errors",
    "reveng-logging",
    "reveng-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
reveng-core-substrate = { workspace = true }
reveng-domain-producers = { workspace = true }
reveng-pass-engine = { workspace = true }
reveng-intermediate-representation = { workspace = true }
reveng-storage-evidence = { workspace = true }
reveng-types = { workspace = true }
reveng-errors = { workspace = true }
reveng-logging = { workspace = true }
reveng-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reveng_static_analysis"]
