[project]
name = "reveng-reasoning"
version = "0.1.0"
description = "RevENG reasoning — deterministic, explainable inference engine (Impl Spec 005)"
requires-python = ">=3.12"
dependencies = [
    "reveng-core-substrate",
    "reveng-knowledge-graph",
    "reveng-storage-evidence",
    "reveng-types",
    "reveng-errors",
    "reveng-logging",
    "reveng-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
reveng-core-substrate = { workspace = true }
reveng-knowledge-graph = { workspace = true }
reveng-storage-evidence = { workspace = true }
reveng-types = { workspace = true }
reveng-errors = { workspace = true }
reveng-logging = { workspace = true }
reveng-config = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reveng_reasoning"]
