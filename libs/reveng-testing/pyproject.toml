[project]
name = "reveng-testing"
version = "0.1.0"
description = "Shared pytest fixtures for engineering tests"
requires-python = ">=3.12"
dependencies = [
    "reveng-types",
    "reveng-errors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
reveng-types = { workspace = true }
reveng-errors = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reveng_testing"]
